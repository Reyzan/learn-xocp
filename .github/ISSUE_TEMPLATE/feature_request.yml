name: ✨ Feature Request
description: Suggest a new feature or enhancement for XOCP
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much detail as possible.

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New Module
        - Enhancement to Existing Module
        - New API Endpoint
        - UI/UX Improvement
        - Performance Optimization
        - Security Enhancement
        - Developer Experience
        - Documentation
        - Modernization/Refactoring
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        Currently, it's difficult to... because...
        This would help users who need to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: |
        I would like to see...
        This could work by...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions?
      placeholder: |
        - Alternative 1: ...
        - Alternative 2: ...

  - type: dropdown
    id: modern-approach
    attributes:
      label: Modern PHP Approach
      description: Should this feature use modern PHP 8+ patterns?
      options:
        - Yes, use PHP 8+ features (enums, readonly, match, etc.)
        - No, maintain backwards compatibility
        - Mixed approach
        - Not sure
    validations:
      required: false

  - type: textarea
    id: example-code
    attributes:
      label: Example Code/API
      description: Show how this feature would be used
      render: php
      placeholder: |
        // Example usage
        $feature = new ProposedFeature();
        $result = $feature->doSomething();

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking my work
        - High - Needed soon
        - Medium - Would be nice to have
        - Low - Future enhancement
    validations:
      required: true

  - type: dropdown
    id: willing-to-implement
    attributes:
      label: Implementation
      description: Are you willing to implement this feature?
      options:
        - Yes, I can submit a PR
        - Yes, with guidance
        - No, but I can help test
        - No
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references
      placeholder: |
        - Related issues: #123
        - Similar feature in Laravel: ...
        - Screenshot: ...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and PRs
          required: true
        - label: This feature aligns with XOCP's modular architecture
          required: false
        - label: I have considered the modernization impact
          required: false
